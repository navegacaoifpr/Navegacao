<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual instituição você quer visitar?</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="visitante.css?v=4">
<link rel="stylesheet" href="../assets/menu.css?v=1">
</head>

<body>

<main class="entrada">

<!-- mesmo logo da página de entrada; se não carregar, aparece o nome escrito -->
<img class="logo" id="logo" src="../assets/logo-ifpr.png" alt="Instituto Federal do Paraná - Jacarezinho"
onerror="this.hidden = true; document.getElementById('logo-text').hidden = false;">

<div id="logo-text" class="logo-text" hidden>
<strong>INSTITUTO FEDERAL</strong>
<span>Paraná Campus Jacarezinho</span>
</div>

<p class="pergunta">Qual instituição você quer visitar?</p>

<div class="carousel">

<button class="carousel-arrow prev hidden" id="prev-btn" title="Anteriores">
<i class="bi bi-chevron-left"></i>
</button>

<div class="carousel-track" id="card-track"></div>

<button class="carousel-arrow next hidden" id="next-btn" title="Próximos">
<i class="bi bi-chevron-right"></i>
</button>

</div>

<div class="carousel-dots" id="carousel-dots"></div>

<a class="voltar" id="back-link" href="../index.html">
<i class="bi bi-arrow-left"></i> Voltar
</a>

</main>

<script src="carrossel.js?v=2"></script>
<script src="instituicoes.js?v=1"></script>
<script src="../assets/menu.js?v=1"></script>

</body>
</html>
