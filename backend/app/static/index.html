<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegação IFPR</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="assets/menu.css?v=1">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:Arial, sans-serif;
  background:#eee6d2;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.gateway{
  width:100%;
  max-width:820px;

  text-align:center;
}

.gateway h1{
  color:#4D7C32;
  font-size:32px;
  margin-bottom:6px;
}

.gateway-logo{
  height:94px;
  width:auto;

  margin-bottom:16px;

  image-rendering:-webkit-optimize-contrast;
}

.gateway p.subtitle{
  color:#5b564d;
  margin-top:0;
  margin-bottom:40px;
  font-size:16px;
}

.choices{
  display:flex;
  gap:24px;

  flex-wrap:wrap;
  justify-content:center;
}

.choice-card{
  flex:1;
  min-width:260px;
  max-width:340px;

  background:#f8f5ee;
  border-radius:20px;

  padding:36px 28px;

  box-shadow:0 10px 30px rgba(0,0,0,0.1);

  cursor:pointer;
  transition:.25s;

  text-decoration:none;
  color:inherit;

  display:block;
}

.choice-card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 40px rgba(0,0,0,0.16);
}

.choice-icon{
  width:76px;
  height:76px;

  border-radius:50%;

  background:#4D7C32;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;

  margin:0 auto 20px;
}

.choice-card h2{
  margin:0 0 10px;
  color:#3f3a32;
  font-size:20px;
}

.choice-card p{
  margin:0;
  color:#7b756d;
  font-size:14px;
  line-height:1.5;
}

.ajuda{
  margin:34px 0 0;
  font-size:14px;
  color:#7b756d;
}

.ajuda a{
  color:#4D7C32;
  font-weight:bold;
  text-decoration:none;
}

.ajuda a:hover{ text-decoration:underline; }

</style>
</head>

<body>

<div class="gateway">

<img src="assets/logo-ifpr.png" alt="Instituto Federal do Paraná - Jacarezinho" class="gateway-logo">
<p class="subtitle">Como você quer entrar?</p>

<div class="choices">

<a class="choice-card" href="visitante/index.html">
<div class="choice-icon"><i class="bi bi-compass"></i></div>
<h2>Sou visitante</h2>
<p>Quero navegar pelos ambientes do campus através das fotos.</p>
</a>

<a class="choice-card" href="admin/login.html">
<div class="choice-icon"><i class="bi bi-shield-lock"></i></div>
<h2>Sou administrador</h2>
<p>Quero acessar o painel para editar o mapa de navegação.</p>
</a>

</div>

<p class="ajuda">
Primeira vez aqui? Veja como funciona para
<a href="paginas/como-funciona-visitante.html">visitantes</a> ou para
<a href="paginas/como-funciona-admin.html">administradores</a>.
</p>

</div>

<script src="assets/menu.js?v=1"></script>

</body>
</html>
