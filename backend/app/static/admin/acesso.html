<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar ou criar conta</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="login.css?v=3">
<link rel="stylesheet" href="login-arte.css?v=1">
<link rel="stylesheet" href="../assets/menu.css?v=1">

<style>
.login-ok{
  background:#eaf4e4; color:#3b6a24; border-left:4px solid #4D7C32;
  padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px;
}
.field-hint{ font-size:12px; color:#7b756d; margin:-10px 0 16px; }
.switch-link{ display:block; margin-top:16px; text-align:center; font-size:13px; color:#4D7C32; text-decoration:none; }
.switch-link:hover{ text-decoration:underline; }
</style>
</head>

<body>

<div class="login-card">

<div class="login-header">
<i class="bi bi-person-circle"></i>
<h1 id="page-title">Entrar na conta</h1>
<p id="page-subtitle" class="login-subtitle">Para criar e editar projetos</p>
</div>

<form id="access-form">

<label for="email">E-mail</label>
<input type="email" id="email" autocomplete="email" required>

<label for="password">Senha</label>
<input type="password" id="password" autocomplete="current-password" required>
<p id="password-hint" class="field-hint hidden">Mínimo de 8 caracteres, com letras e números.</p>

<div id="confirm-box" class="hidden">
<label for="password2">Confirmar senha</label>
<input type="password" id="password2" autocomplete="new-password">
</div>

<div id="access-ok" class="login-ok hidden"></div>
<div id="access-error" class="login-error hidden"></div>

<button type="submit" id="access-submit">Entrar</button>

<a class="switch-link" id="switch-link" href="#">Não tenho conta. Criar conta</a>
<a class="switch-link" id="forgot-link" href="redefinir.html">Esqueci minha senha</a>

</form>

<a class="back-link" href="projetos.html">
<i class="bi bi-arrow-left"></i> Voltar para os projetos
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=1"></script>
<script src="sessao.js?v=3"></script>
<script src="auth.js?v=1"></script>
<script src="acesso.js?v=1"></script>

<script src="login-arte.js?v=1"></script>
<script src="../assets/menu.js?v=1"></script>

</body>
</html>
