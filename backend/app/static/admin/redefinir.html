<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="login.css?v=3">
<link rel="stylesheet" href="login-arte.css?v=1">
<link rel="stylesheet" href="../assets/menu.css?v=1">

<style>
.login-ok{
  background:#eaf4e4; color:#3b6a24; border-left:4px solid #4D7C32;
  padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px;
}
.field-hint{ font-size:12px; color:#7b756d; margin:-10px 0 16px; }
.intro{ font-size:14px; color:#5b564d; margin:0 0 18px; line-height:1.45; }
</style>
</head>

<body>

<div class="login-card">

<div class="login-header">
<i class="bi bi-key"></i>
<h1 id="page-title">Recuperar senha</h1>
</div>

<!-- PASSO 1: pedir o link por e-mail -->
<form id="request-form">

<p class="intro">
Digite o e-mail da sua conta. Vamos enviar um link para você escolher uma nova senha.
</p>

<label for="email">E-mail</label>
<input type="email" id="email" autocomplete="email" required>

<div id="request-ok" class="login-ok hidden"></div>
<div id="request-error" class="login-error hidden"></div>

<button type="submit" id="request-submit">Enviar link por e-mail</button>

</form>

<!-- PASSO 2: escolher a nova senha (abre pelo link do e-mail) -->
<form id="reset-form" class="hidden">

<label for="new-password">Nova senha</label>
<input type="password" id="new-password" autocomplete="new-password" required>
<p class="field-hint">Mínimo de 8 caracteres, com letras e números.</p>

<label for="new-password2">Confirmar nova senha</label>
<input type="password" id="new-password2" autocomplete="new-password" required>

<div id="reset-ok" class="login-ok hidden"></div>
<div id="reset-error" class="login-error hidden"></div>

<button type="submit" id="reset-submit">Salvar nova senha</button>

</form>

<a class="back-link" id="back-link" href="projetos.html">
<i class="bi bi-arrow-left"></i> Voltar para os projetos
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=1"></script>
<script src="sessao.js?v=3"></script>
<script src="auth.js?v=1"></script>
<script src="redefinir.js?v=2"></script>

<script src="login-arte.js?v=1"></script>
<script src="../assets/menu.js?v=1"></script>

</body>
</html>
